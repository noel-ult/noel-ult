<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Barlow;src:url('../assets/fonts/BarlowCondensed-ExtraBold.ttf');font-weight:800}
@font-face{font-family:Space;src:url('../assets/fonts/SpaceGrotesk.ttf')}
@font-face{font-family:Jet;src:url('../assets/fonts/JetBrainsMono.ttf')}
body{margin:0;background:#080b12}canvas{display:block}
</style><canvas width="1200" height="500"></canvas>
<script>
const canvas=document.querySelector('canvas'), c=canvas.getContext('2d');
const P={bg:'#080B12',surface:'#141C2B',silver:'#E4EAF2',muted:'#A7B5CA',blue:'#3D7EFF',line:'#25334B'};
const clamp=n=>Math.max(0,Math.min(1,n));
function text(s,x,y,size=20,color=P.silver,font='Space',weight=400){c.fillStyle=color;c.font=`${weight} ${size}px ${font}`;c.fillText(s,x,y)}
function path(points,color=P.line,width=2){c.strokeStyle=color;c.lineWidth=width;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()}
function dot(x,y,r=4,color=P.blue){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function base(h){canvas.width=1200;canvas.height=h;c.fillStyle=P.bg;c.fillRect(0,0,1200,h);c.save();c.globalAlpha=.4;for(let x=24;x<1200;x+=24)for(let y=24;y<h;y+=24)dot(x,y,.65,P.line);c.restore();path([[0,h-1],[1200,h-1]],P.line,2);}
function trace(points,progress){const total=points.length-1,at=clamp(progress)*total;c.save();c.shadowColor=P.blue;c.shadowBlur=12;const visible=points.slice(0,Math.floor(at)+1);const i=Math.min(Math.floor(at),total-1),f=at-i;const end=[points[i][0]+(points[i+1][0]-points[i][0])*f,points[i][1]+(points[i+1][1]-points[i][1])*f];visible.push(end);path(visible,P.blue,3);dot(...end,5,P.silver);c.restore()}
const graphNodes=[[740,270],[810,190],[810,340],[900,240],[900,370],[990,165],[990,310],[1090,240]];
const edges=[[0,1],[0,2],[1,3],[2,3],[2,4],[3,5],[3,6],[4,6],[5,7],[6,7]];
function graph(progress=1){
 for(const [a,b]of edges)path([graphNodes[a],graphNodes[b]],P.line,2);
 for(const [x,y]of graphNodes){dot(x,y,9,P.bg);c.strokeStyle=P.muted;c.lineWidth=1.5;c.stroke()}
 trace([graphNodes[0],graphNodes[1],graphNodes[3],graphNodes[5],graphNodes[7]],progress);
 text('START',714,306,15,P.muted,'Jet');text('GOAL',1064,276,15,P.muted,'Jet');
}
function pages(progress=1){
 for(const x of [730,947]){c.strokeStyle=P.line;c.lineWidth=2;c.strokeRect(x,158,170,210);path([[x,189],[x+170,189]]);for(let row=0;row<5;row++){const y=220+row*26;path([[x+17,y],[x+139-(row%2)*23,y]],row===2&&x===947?P.blue:P.line,6)}dot(x+18,174,3,P.muted)}
 c.fillStyle='#3d7eff22';c.fillRect(956,256,152,30);trace([[900,277],[920,277],[920,285],[947,285]],progress);
 text('BEFORE',730,407,18,P.muted,'Jet');text('AFTER',947,407,18,P.blue,'Jet');
}
function local(progress=1){
 const boxes=[[720,200,100,'PROMPT'],[875,200,112,'OLLAMA'],[1040,200,112,'REPLY']];
 for(const [x,y,w,label]of boxes){c.fillStyle=P.surface;c.fillRect(x,y,w,74);c.strokeStyle=P.line;c.strokeRect(x,y,w,74);text(label,x+12,y+44,17,P.silver,'Jet')}
 path([[820,260],[875,260]]);path([[987,260],[1040,260]]);path([[930,274],[930,337],[804,337],[804,274]]);
 text('SQLite memory',861,372,17,P.muted,'Jet');
 trace([[725,260],[820,260],[875,260],[987,260],[1040,260],[1147,260]],progress);
}
function hero(t=8){
 base(500);
 text('NOEL-ULT',48,48,18,P.muted,'Jet');text('SOFTWARE / AI / SYSTEMS',744,48,18,P.muted,'Jet');
 path([[48,72],[1152,72]]);
 text('NOEL',42,237,176,P.silver,'Barlow',800);text('BIJU',42,395,176,P.silver,'Barlow',800);
 text('FOLLOW THE QUESTION.',48,453,24,P.blue,'Jet');
 path([[657,106],[657,405]],P.line,1);
 let kind=t<2.6?0:t<5?1:t<7.1?2:0;
 const start=[0,2.6,5][kind],duration=[2.3,2.1,1.8][kind];
 const p=t>=7.1?1:clamp((t-start)/duration);
 let a=1;
 if(t<7.1){const elapsed=t-start; a=Math.min(1,elapsed/.2);const end=[2.6,5,7.1][kind];if(t>end-.2)a=(end-t)/.2}
 c.save();c.globalAlpha=a;
 text(['SEARCH. REPLAN. UNDERSTAND.','OBSERVE WHAT CHANGED.','KEEP THE MODEL CLOSE.'][kind],720,119,17,P.blue,'Jet');
 [graph,pages,local][kind](p);c.restore();
 text('CURIOUS ABOUT HOW THINGS WORK.',720,453,17,P.muted,'Jet');
 return canvas.toDataURL('image/png').split(',')[1];
}
function miniMaze(){
 const x=776,y=30,s=24;
 const routeCells=new Set();
 for(const [a,b]of [[[0,0],[1,0]],[[1,0],[1,2]],[[1,2],[3,2]],[[3,2],[3,4]],[[3,4],[6,4]],[[6,4],[6,6]],[[6,6],[12,6]]])for(let col=Math.min(a[0],b[0]);col<=Math.max(a[0],b[0]);col++)for(let row=Math.min(a[1],b[1]);row<=Math.max(a[1],b[1]);row++)routeCells.add(`${col},${row}`);
 for(let row=0;row<7;row++)for(let col=0;col<13;col++)if(!routeCells.has(`${col},${row}`)&&(col*3+row*7)%5<2){c.fillStyle=P.line;c.fillRect(x+col*s,y+row*s,21,21)}
 trace([[788,42],[812,42],[812,90],[860,90],[860,138],[932,138],[932,186],[1076,186]],1);
}
function inspection(){
 for(let k=0;k<2;k++){
 c.save();c.translate(810+k*165,112);c.strokeStyle=k?P.blue:P.muted;c.lineWidth=2;c.beginPath();c.ellipse(0,0,49,76,.6,0,Math.PI*2);c.stroke();path([[-35,60],[35,-60]],k?P.blue:P.muted);for(let j=0;j<5;j++){let y=-40+j*20;path([[y/2,y],[y/2+30,y-10]],P.line)}c.restore();
 }
 path([[900,27],[900,192]],P.line,1);text('IMAGE',757,211,14,P.muted,'Jet');text('MODEL',932,211,14,P.blue,'Jet');
}
function handRice(){
 const hand=[[760,190],[748,151],[728,130],[724,112],[739,111],[759,133],[750,63],[758,53],[769,61],[783,114],[780,38],[789,31],[799,39],[804,110],[813,48],[823,43],[830,52],[829,118],[850,78],[860,80],[866,90],[850,155],[831,190]];
 path(hand,P.muted,2);for(const p of hand)dot(...p,3,P.blue);
 c.strokeStyle=P.line;c.lineWidth=2;c.beginPath();c.ellipse(1020,119,85,65,0,0,Math.PI*2);c.stroke();
 for(let i=0;i<50;i++){const a=i*2.399,r=Math.sqrt(i)*7;c.save();c.translate(1020+Math.cos(a)*r,119+Math.sin(a)*r*.6);c.rotate(a);path([[-3,0],[3,0]],i%4?P.muted:P.blue,2);c.restore()}
 path([[873,120],[920,120]],P.blue,2);
}
function project(kind){
 base(240);
 const names=['REVERSE ESCAPE','PAGERADAR','TRUTHLENS','CHORU VAARI'];
 const labels=['PARTIAL OBSERVATION / PATHFINDING','CHANGE DETECTION / EVIDENCE','COMPUTER VISION / EVALUATION','HAND LANDMARKS / RICE MATH'];
 const subtitles=['Build the trap. Watch the agent adapt.','The web changes. Keep the evidence.','Look closer. Question the prediction.','A very serious handful of rice.'];
 text(labels[kind],40,46,16,P.blue,'Jet');text(names[kind],38,130,68,P.silver,'Barlow',800);text(subtitles[kind],40,187,23,P.muted);
 c.save();c.beginPath();c.rect(690,0,510,240);c.clip();
 if(kind===0)miniMaze();if(kind===1){c.translate(210,-67);c.scale(.72,.72);pages(1)}if(kind===2)inspection();if(kind===3)handRice();c.restore();
 return canvas.toDataURL('image/png').split(',')[1];
}
function section(label,sub){base(88);c.fillStyle=P.blue;c.fillRect(0,0,5,88);text(label,28,54,31,P.silver,'Barlow',800);c.textAlign='right';text(sub,1160,51,16,P.muted,'Jet');c.textAlign='left';return canvas.toDataURL('image/png').split(',')[1]}
window.art={hero,project,section};
window.ready=Promise.all(['800 100px Barlow','400 20px Space','400 20px Jet'].map(f=>document.fonts.load(f)));
</script>
