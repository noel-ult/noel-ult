<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">Noel Biju developer command deck</title><desc id="desc">A dark visual dashboard showing current focus, four featured projects, engineering tools, and a personal engineering philosophy.</desc>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#0b1222"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#101a2d"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
  <linearGradient id="line" x2="1"><stop stop-color="#28e7d2"/><stop offset=".55" stop-color="#5b8cff"/><stop offset="1" stop-color="#b66cff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.label{font-size:12px;letter-spacing:2px;fill:#6ef0de}.head{font-size:22px;font-weight:700;fill:#eef5ff}.body{font-size:15px;fill:#b5c4da}.tag{font-size:12px;fill:#91a8c5}.num{font-size:13px;fill:#5b8cff}</style>
</defs>
<rect width="1200" height="1020" rx="22" fill="url(#bg)"/>
<g opacity=".3" stroke="#314461"><path d="M35 33h250M915 33h250M35 987h250M915 987h250"/><path d="M35 33v52M1165 33v52M35 935v52M1165 935v52"/></g>
<text x="58" y="76" class="label">NOEL-ULT / COMMAND DECK</text><text x="1142" y="76" text-anchor="end" class="tag">LIVE SYSTEM MAP · 01</text><path d="M58 98h1084" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
<rect x="58" y="126" width="1084" height="132" rx="14" fill="url(#card)" stroke="#283b59"/>
<circle cx="94" cy="166" r="8" fill="#39f0b5" filter="url(#glow)"/><text x="116" y="170" class="label">CURRENT SIGNAL</text><text x="86" y="210" class="head">Building software that can explain itself.</text><text x="86" y="236" class="body">Web monitoring · AI systems · developer tooling · computer vision experiments</text><text x="1075" y="183" text-anchor="end" class="tag">ARCH / VS CODE / TERMINAL</text><text x="1075" y="214" text-anchor="end" class="tag">STATUS: MAKING THINGS</text>
<text x="58" y="307" class="num">02</text><text x="90" y="307" class="head">SELECTED BUILDS</text><path d="M58 326h1084" stroke="#283b59"/>
<g>
<rect x="58" y="352" width="525" height="200" rx="14" fill="url(#card)" stroke="#29435d"/><rect x="58" y="352" width="7" height="200" rx="3" fill="#35e6c8"/><text x="91" y="390" class="label">01 / WEB SYSTEM</text><text x="91" y="424" class="head">PAGERADAR</text><text x="91" y="454" class="body">Intelligent public-page monitoring and change detection.</text><text x="91" y="484" class="tag">Next.js · NestJS · GraphQL · Prisma · Supabase · Docker</text><text x="91" y="518" class="tag">snapshots → hashes → events → history</text>
<rect x="617" y="352" width="525" height="200" rx="14" fill="url(#card)" stroke="#29435d"/><rect x="617" y="352" width="7" height="200" rx="3" fill="#6f9cff"/><text x="650" y="390" class="label">02 / MOBILE SYSTEM</text><text x="650" y="424" class="head">ETLABPRO</text><text x="650" y="450" class="body">Student companion for attendance, results,</text><text x="650" y="470" class="body">and academic insight.</text><text x="650" y="500" class="tag">Flutter · FastAPI · Supabase · JWT · ETLAB scraping</text><text x="650" y="528" class="tag">sync → analytics → timetable → calendar</text>
<rect x="58" y="578" width="525" height="200" rx="14" fill="url(#card)" stroke="#29435d"/><rect x="58" y="578" width="7" height="200" rx="3" fill="#b66cff"/><text x="91" y="616" class="label">03 / AI SYSTEM</text><text x="91" y="650" class="head">VERITAS AI</text><text x="91" y="676" class="body">Evidence-first technical interviews with</text><text x="91" y="696" class="body">inspectable reasoning.</text><text x="91" y="726" class="tag">Next.js 15 · FastAPI · Framer Motion · Docker</text><text x="91" y="754" class="tag">probe → verify → map confidence → report</text>
<rect x="617" y="578" width="525" height="200" rx="14" fill="url(#card)" stroke="#29435d"/><rect x="617" y="578" width="7" height="200" rx="3" fill="#f5bd55"/><text x="650" y="616" class="label">04 / VISION EXPERIMENT</text><text x="650" y="650" class="head">CHORU VAARI KODUKKAM</text><text x="650" y="680" class="body">Turns hand landmarks and a plate image into a vaari estimate.</text><text x="650" y="710" class="tag">TypeScript · Next.js · MediaPipe · Canvas · camera</text><text x="650" y="744" class="tag">calibrate → observe → estimate → laugh responsibly</text>
</g>
<text x="58" y="833" class="num">03</text><text x="90" y="833" class="head">ENGINEERING PALETTE</text><path d="M58 852h1084" stroke="#283b59"/>
<g><rect x="58" y="877" width="212" height="54" rx="10" fill="#101a2d" stroke="#29435d"/><rect x="284" y="877" width="212" height="54" rx="10" fill="#101a2d" stroke="#29435d"/><rect x="510" y="877" width="212" height="54" rx="10" fill="#101a2d" stroke="#29435d"/><rect x="736" y="877" width="192" height="54" rx="10" fill="#101a2d" stroke="#29435d"/><rect x="942" y="877" width="200" height="54" rx="10" fill="#101a2d" stroke="#29435d"/><text x="76" y="900" class="label">LANGUAGES</text><text x="76" y="921" class="tag">PY · TS · JS · JAVA</text><text x="302" y="900" class="label">PRODUCT</text><text x="302" y="921" class="tag">REACT · NEXT · FLUTTER</text><text x="528" y="900" class="label">BACKEND</text><text x="528" y="921" class="tag">FASTAPI · NEST · GRAPHQL</text><text x="754" y="900" class="label">DATA</text><text x="754" y="921" class="tag">POSTGRES · PRISMA</text><text x="960" y="900" class="label">SHIP</text><text x="960" y="921" class="tag">DOCKER · AWS · LINUX</text></g>
<path d="M58 963h1084" stroke="url(#line)" stroke-width="2"/><text x="600" y="990" text-anchor="middle" class="tag">BUILD FIRST · UNDERSTAND DEEPLY · REFACTOR RELENTLESSLY</text>
</svg>
